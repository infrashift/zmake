name: Deploy Docs to GitHub Pages

# Publishes the Astro site in docs/ to https://infrashift.github.io/zmake/.
# The repository's Pages source must be "GitHub Actions" (Settings → Pages).
# With "Deploy from a branch", GitHub runs its own Jekyll build of docs/
# instead, and the deploy step below has no Pages site to publish to.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-release.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          path: ./docs
          # Pinned so the action uses the bun that wrote docs/bun.lock.
          package-manager: bun@1.3.9

  deploy:
    # Pull requests only build, so a broken page is caught in review.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
